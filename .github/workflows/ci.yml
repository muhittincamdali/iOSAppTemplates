name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-tool:
    name: create-ios-app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Scaffold a project and test it in the simulator
        run: |
          swift run create-ios-app new SmokeShop --template ecommerce --output "$RUNNER_TEMP"
          udid="$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')"
          cd "$RUNNER_TEMP/SmokeShop"
          xcodebuild test -scheme SmokeShop-Package -destination "platform=iOS Simulator,id=$udid" -quiet

  templates:
    name: ${{ matrix.template }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template:
          - AIAssistantApp
          - BookingReservationsApp
          - CRMAdminApp
          - CreatorShortVideoApp
          - EcommerceApp
          - EducationApp
          - FinanceApp
          - FitnessApp
          - FoodDeliveryApp
          - MarketplaceApp
          - MessagingApp
          - MusicPodcastApp
          - NewsBlogApp
          - NotesKnowledgeApp
          - PrivacyVaultApp
          - ProductivityApp
          - SocialMediaApp
          - SubscriptionLifestyleApp
          - TeamCollaborationApp
          - TravelPlannerApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        env:
          TEMPLATE: ${{ matrix.template }}
        run: scripts/test-templates.sh "$TEMPLATE"
