name: Version badge

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - CHANGELOG.md
      - README*.md
      - .github/brand/badge-version-*.svg
      - scripts/check-version-badge.sh
      - .github/workflows/version-badge.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the badge with the newest CHANGELOG release
        run: scripts/check-version-badge.sh
