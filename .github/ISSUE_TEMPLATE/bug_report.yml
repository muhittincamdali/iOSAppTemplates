name: Bug report
description: Something in a template or in create-ios-app does not work as described.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - A template under Templates/
        - create-ios-app / TemplateScaffold
        - Scripts or CI
        - Documentation
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template
      description: Directory name, if a template is affected.
      placeholder: EcommerceApp
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or command to reproduce
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Xcode 27.0, iOS 27 simulator, macOS 27, commit abc1234
    validations:
      required: true
