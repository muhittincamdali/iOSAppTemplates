name: TravelPlannerApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  TravelPlannerApp:
    path: ..
targets:
  TravelPlannerAppHost:
    type: application
    platform: iOS
    sources:
      - path: TravelPlannerAppHost.swift
    dependencies:
      - package: TravelPlannerApp
        product: TravelPlannerApp
    settings:
      base:
        PRODUCT_NAME: TravelPlannerApp
        PRODUCT_MODULE_NAME: TravelPlannerAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TravelPlannerApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
