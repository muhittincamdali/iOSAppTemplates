name: SubscriptionLifestyleApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  SubscriptionLifestyleApp:
    path: ..
targets:
  SubscriptionLifestyleAppHost:
    type: application
    platform: iOS
    sources:
      - path: SubscriptionLifestyleAppHost.swift
    dependencies:
      - package: SubscriptionLifestyleApp
        product: SubscriptionLifestyleApp
    settings:
      base:
        PRODUCT_NAME: SubscriptionLifestyleApp
        PRODUCT_MODULE_NAME: SubscriptionLifestyleAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SubscriptionLifestyleApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
