name: NewsBlogApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  NewsBlogApp:
    path: ..
targets:
  NewsBlogAppHost:
    type: application
    platform: iOS
    sources:
      - path: NewsBlogAppHost.swift
    dependencies:
      - package: NewsBlogApp
        product: NewsBlogApp
    settings:
      base:
        PRODUCT_NAME: NewsBlogApp
        PRODUCT_MODULE_NAME: NewsBlogAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NewsBlogApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
