name: SocialMediaApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  SocialMediaApp:
    path: ..
targets:
  SocialMediaAppHost:
    type: application
    platform: iOS
    sources:
      - path: SocialMediaAppHost.swift
    dependencies:
      - package: SocialMediaApp
        product: SocialMediaApp
    settings:
      base:
        PRODUCT_NAME: SocialMediaApp
        PRODUCT_MODULE_NAME: SocialMediaAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SocialMediaApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
