name: ProductivityApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  ProductivityApp:
    path: ..
targets:
  ProductivityAppHost:
    type: application
    platform: iOS
    sources:
      - path: ProductivityAppHost.swift
    dependencies:
      - package: ProductivityApp
        product: ProductivityApp
    settings:
      base:
        PRODUCT_NAME: ProductivityApp
        PRODUCT_MODULE_NAME: ProductivityAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ProductivityApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
