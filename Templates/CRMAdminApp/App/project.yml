name: CRMAdminApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  CRMAdminApp:
    path: ..
targets:
  CRMAdminAppHost:
    type: application
    platform: iOS
    sources:
      - path: CRMAdminAppHost.swift
    dependencies:
      - package: CRMAdminApp
        product: CRMAdminApp
    settings:
      base:
        PRODUCT_NAME: CRMAdminApp
        PRODUCT_MODULE_NAME: CRMAdminAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CRMAdminApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
