name: MusicPodcastApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  MusicPodcastApp:
    path: ..
targets:
  MusicPodcastAppHost:
    type: application
    platform: iOS
    sources:
      - path: MusicPodcastAppHost.swift
    dependencies:
      - package: MusicPodcastApp
        product: MusicPodcastApp
    settings:
      base:
        PRODUCT_NAME: MusicPodcastApp
        PRODUCT_MODULE_NAME: MusicPodcastAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicPodcastApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
