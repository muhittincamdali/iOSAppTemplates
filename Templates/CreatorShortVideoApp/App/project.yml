name: CreatorShortVideoApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  CreatorShortVideoApp:
    path: ..
targets:
  CreatorShortVideoAppHost:
    type: application
    platform: iOS
    sources:
      - path: CreatorShortVideoAppHost.swift
    dependencies:
      - package: CreatorShortVideoApp
        product: CreatorShortVideoApp
    settings:
      base:
        PRODUCT_NAME: CreatorShortVideoApp
        PRODUCT_MODULE_NAME: CreatorShortVideoAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CreatorShortVideoApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
