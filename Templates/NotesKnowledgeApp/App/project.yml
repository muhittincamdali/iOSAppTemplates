name: NotesKnowledgeApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  NotesKnowledgeApp:
    path: ..
targets:
  NotesKnowledgeAppHost:
    type: application
    platform: iOS
    sources:
      - path: NotesKnowledgeAppHost.swift
    dependencies:
      - package: NotesKnowledgeApp
        product: NotesKnowledgeApp
    settings:
      base:
        PRODUCT_NAME: NotesKnowledgeApp
        PRODUCT_MODULE_NAME: NotesKnowledgeAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NotesKnowledgeApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
