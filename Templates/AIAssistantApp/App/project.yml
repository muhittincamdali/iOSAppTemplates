name: AIAssistantApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  AIAssistantApp:
    path: ..
targets:
  AIAssistantAppHost:
    type: application
    platform: iOS
    sources:
      - path: AIAssistantAppHost.swift
    dependencies:
      - package: AIAssistantApp
        product: AIAssistantApp
    settings:
      base:
        PRODUCT_NAME: AIAssistantApp
        PRODUCT_MODULE_NAME: AIAssistantAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIAssistantApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
