name: PrivacyVaultApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  PrivacyVaultApp:
    path: ..
targets:
  PrivacyVaultAppHost:
    type: application
    platform: iOS
    sources:
      - path: PrivacyVaultAppHost.swift
    dependencies:
      - package: PrivacyVaultApp
        product: PrivacyVaultApp
    settings:
      base:
        PRODUCT_NAME: PrivacyVaultApp
        PRODUCT_MODULE_NAME: PrivacyVaultAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PrivacyVaultApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
