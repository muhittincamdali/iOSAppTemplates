name: EducationApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  EducationApp:
    path: ..
targets:
  EducationAppHost:
    type: application
    platform: iOS
    sources:
      - path: EducationAppHost.swift
    dependencies:
      - package: EducationApp
        product: EducationApp
    settings:
      base:
        PRODUCT_NAME: EducationApp
        PRODUCT_MODULE_NAME: EducationAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EducationApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
