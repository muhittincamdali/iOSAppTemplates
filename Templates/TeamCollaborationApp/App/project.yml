name: TeamCollaborationApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  TeamCollaborationApp:
    path: ..
targets:
  TeamCollaborationAppHost:
    type: application
    platform: iOS
    sources:
      - path: TeamCollaborationAppHost.swift
    dependencies:
      - package: TeamCollaborationApp
        product: TeamCollaborationApp
    settings:
      base:
        PRODUCT_NAME: TeamCollaborationApp
        PRODUCT_MODULE_NAME: TeamCollaborationAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TeamCollaborationApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
