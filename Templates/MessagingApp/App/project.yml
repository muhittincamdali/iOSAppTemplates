name: MessagingApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  MessagingApp:
    path: ..
targets:
  MessagingAppHost:
    type: application
    platform: iOS
    sources:
      - path: MessagingAppHost.swift
    dependencies:
      - package: MessagingApp
        product: MessagingApp
    settings:
      base:
        PRODUCT_NAME: MessagingApp
        PRODUCT_MODULE_NAME: MessagingAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MessagingApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme: {}
