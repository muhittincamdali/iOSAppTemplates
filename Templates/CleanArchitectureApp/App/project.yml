name: CleanArchitectureApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  CleanArchitectureApp:
    path: ..
targets:
  CleanArchitectureAppHost:
    type: application
    platform: iOS
    sources:
      - path: CleanArchitectureAppHost.swift
    dependencies:
      - package: CleanArchitectureApp
        product: CleanArchitectureApp
    settings:
      base:
        PRODUCT_NAME: CleanArchitectureApp
        PRODUCT_MODULE_NAME: CleanArchitectureAppHost
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CleanArchitectureApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - CleanArchitectureAppUITests
  CleanArchitectureAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CleanArchitectureAppHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CleanArchitectureAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CleanArchitectureAppHost
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
